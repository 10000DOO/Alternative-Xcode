id = "xcode-tools"
name = "Xcode Tools"
version = "0.1.0"
schema_version = 1
authors = ["10000doo"]
description = "Build, run, test, and debug Xcode projects in Zed"
repository = "https://github.com/10000DOO/Alternative-Xcode"

[debug_adapters.xcode-debug]

# Objective-C language support: register the grammar and route ObjC to
# sourcekit-lsp (which honors our buildServer.json and pushes sourceKitOptions
# args into its embedded clangd). Swift is intentionally NOT bound here — the
# user keeps their existing Swift extension. See design doc §8.0.
[grammars.objc]
repository = "https://github.com/tree-sitter-grammars/tree-sitter-objc"
commit = "181a81b8f23a2d593e7ab4259981f50122909fda"

[language_servers.sourcekit-lsp]
name = "SourceKit-LSP"
languages = ["Objective-C"]
